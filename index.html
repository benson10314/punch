<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行動打卡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>行動打卡</title>
<style>
:root{
  --bg:#0f172a; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --ok:#059669; --okbg:#ecfdf5; --warn:#d97706; --warnbg:#fffbeb;
  --bad:#dc2626; --badbg:#fef2f2; --brand:#2563eb; --brand2:#1d4ed8;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  /* 深→淺用漸層柔和過渡，避免卡片剛好壓在硬邊界上；過渡在卡片開始前就收完 */
  background:linear-gradient(180deg,#0f172a 0,#16223a 155px,#54627c 200px,#d5dde7 232px,#f1f5f9 260px,#f1f5f9 100%);
  background-attachment:fixed; color:var(--ink); min-height:100vh;
  padding:0 16px calc(28px + env(safe-area-inset-bottom));
  padding-top:calc(14px + env(safe-area-inset-top));
}
.wrap{max-width:460px;margin:0 auto}
.hidden{display:none !important}

/* 頂部 */
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:14px}
.who{min-width:0}
.who b{display:block;font-size:19px;font-weight:700;letter-spacing:.5px}
.who span{font-size:13px;color:#94a3b8}
.linkbtn{background:rgba(255,255,255,.12);color:#e2e8f0;border:0;border-radius:999px;
  padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer}
.linkbtn:active{background:rgba(255,255,255,.22)}

/* 時鐘 */
.clock{text-align:center;color:#fff;margin:4px 0 18px}
.clock .t{font-size:52px;font-weight:200;letter-spacing:2px;line-height:1.1;
  font-variant-numeric:tabular-nums}
.clock .t small{font-size:24px;opacity:.6;margin-left:2px}
.clock .d{font-size:14px;color:#94a3b8;margin-top:4px}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:0 4px 18px rgba(15,23,42,.09)}
.card h3{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.5px}

/* 定位狀態 */
#gpsCard{border-top:4px solid var(--muted);transition:border-color .25s;padding-top:15px}
#gpsCard.ok{border-top-color:var(--ok)}
#gpsCard.warn{border-top-color:var(--warn)}
#gpsCard.bad{border-top-color:var(--bad)}
.gps-head{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16.5px;
  letter-spacing:.3px;line-height:1.4}
#gpsCard.ok .gps-head{color:#047857}
#gpsCard.warn .gps-head{color:#b45309}
#gpsCard.bad .gps-head{color:#b91c1c}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{animation:pulse 1.6s infinite}
#gpsCard.ok .dot{background:var(--ok)} #gpsCard.warn .dot{background:var(--warn)}
#gpsCard.bad .dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* 距離／誤差兩格數字 */
.gps-metrics{display:flex;gap:9px;margin-top:13px}
.gps-metrics>div{flex:1;background:#f8fafc;border:1px solid var(--line);border-radius:12px;
  padding:9px 6px;text-align:center}
.gps-metrics b{display:block;font-size:21px;font-weight:700;line-height:1.15;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.gps-metrics span{display:block;font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
#gpsCard.ok  .m-dist b{color:var(--ok)}
#gpsCard.bad .m-dist b{color:var(--bad)}
#gpsCard.warn .m-acc b{color:var(--warn)}

.gps-sub{margin-top:11px;font-size:13px;color:var(--muted);line-height:1.7}
.bar{height:7px;border-radius:99px;background:var(--line);margin-top:13px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok);width:0;
  transition:width .4s ease,background .3s}
#gpsCard.warn .bar>i,#gpsCard.bad .bar>i{background:var(--bad)}

/* 打卡按鈕 */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.punch{border:0;border-radius:var(--radius);padding:24px 8px;font-family:inherit;color:#fff;
  font-size:19px;font-weight:700;letter-spacing:2px;cursor:pointer;
  box-shadow:0 6px 16px rgba(15,23,42,.14);transition:transform .08s,opacity .2s}
.punch small{display:block;font-size:11.5px;font-weight:400;letter-spacing:1px;opacity:.85;margin-top:5px}
.punch.in{background:linear-gradient(160deg,#10b981,#047857)}
.punch.out{background:linear-gradient(160deg,#f97316,#c2410c)}
.punch:active{transform:scale(.97)}
.punch:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}

/* 紀錄 */
.rec{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.rec:last-child{border-bottom:0}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;flex:none}
.tag.in{background:var(--okbg);color:var(--ok)} .tag.out{background:#fff7ed;color:#c2410c}
.rec .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.rec .mt{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:14px 0}

/* 登入 */
#loginView .card{margin-top:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:14px;font-size:17px;font-family:inherit;border:1.5px solid var(--line);
  border-radius:12px;background:#f8fafc;color:var(--ink)}
.field input:focus{outline:0;border-color:var(--brand);background:#fff}
.primary{width:100%;padding:15px;border:0;border-radius:12px;background:var(--brand);color:#fff;
  font-size:16.5px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:1px}
.primary:active{background:var(--brand2)} .primary:disabled{opacity:.5}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:16px}
.check input{width:18px;height:18px;accent-color:var(--brand)}

/* 查詢紀錄 */
.qrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.qrow label{font-size:12.5px;color:var(--muted);font-weight:600;flex:none}
.qrow input[type=date]{flex:1;min-width:0;padding:9px 10px;font-size:14px;font-family:inherit;
  border:1.5px solid var(--line);border-radius:10px;background:#f8fafc;color:var(--ink)}
.qrow input[type=date]:focus{outline:0;border-color:var(--brand);background:#fff}
.qquick{margin-bottom:4px}
.qquick .linkbtn{background:#f1f5f9;color:#475569;padding:7px 11px;font-size:12.5px}
.qquick .linkbtn.on{background:#dbeafe;color:#1d4ed8}
.qgo{margin-left:auto;border:0;border-radius:9px;background:var(--brand);color:#fff;
  padding:8px 16px;font-size:13px;font-weight:700;font-family:inherit;letter-spacing:1px;cursor:pointer}
.qgo:active{background:var(--brand2)}
.qgo:disabled{opacity:.5}
.qinfo{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;
  padding:8px 11px;font-size:12.5px;margin:10px 0 2px;line-height:1.6}
.dsep{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;
  padding:11px 0 3px;border-bottom:1px solid var(--line)}

/* 提示 / Toast */
.note{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7;margin-top:10px}
.banner{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;
  padding:11px 13px;font-size:12.5px;line-height:1.6;margin-bottom:14px;display:flex;gap:8px}
.banner button{margin-left:auto;background:0;border:0;color:#1e40af;font-size:18px;cursor:pointer;padding:0 2px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));
  max-width:428px;margin:0 auto;padding:15px 17px;border-radius:14px;color:#fff;font-size:14.5px;
  line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:99;
  transform:translateY(140%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
#toast.show{transform:translateY(0)}
#toast.ok{background:#047857} #toast.bad{background:#b91c1c} #toast.warn{background:#b45309}
/* 超時提醒 */
#remind{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(69,26,3,0);transition:background .25s}
#remind.on{background:rgba(69,26,3,.72)}
#remind .rbox{width:100%;max-width:400px;background:#fff;border-radius:20px;overflow:hidden;
  transform:scale(.88);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1),opacity .25s;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
#remind.on .rbox{transform:scale(1);opacity:1}
.rhead{background:linear-gradient(160deg,#f59e0b,#c2410c);color:#fff;padding:22px 20px;text-align:center}
.rhead .ic{font-size:38px;line-height:1}
.rhead .ti{font-size:19px;font-weight:700;letter-spacing:3px;margin-top:8px}
.rhead .tm{font-size:13px;opacity:.9;margin-top:5px;letter-spacing:1px}
.rbody{padding:20px}
.rbody .msg{font-size:15.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.rbody .cnt{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.rbody button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:13px;
  background:linear-gradient(160deg,#f59e0b,#c2410c);color:#fff;font-family:inherit;
  font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer}
.rbody button:active{transform:scale(.98)}

/* 今日提醒事項卡 */
#rmdCard{border-top:4px solid var(--warn);padding-top:15px}
#rmdCard h3{color:#b45309}
.rmd{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rmd:last-child{border-bottom:0}
.rmd .t{font-weight:700;font-variant-numeric:tabular-nums;color:#b45309;flex:none}
.rmd .m{color:var(--muted);line-height:1.6}
.rmd.done .t{color:var(--muted)}
.rmd .ok{margin-left:auto;font-size:11px;color:var(--ok);flex:none}

/* 打卡確認面板 */
#confirm{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(15,23,42,0);transition:background .25s}
#confirm.on{background:rgba(15,23,42,.55)}
#confirm .sheet{width:100%;max-width:460px;background:#fff;border-radius:22px 22px 0 0;
  padding:24px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;  /* 小螢幕也能捲到按鈕 */
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 -8px 40px rgba(15,23,42,.3)}
#confirm.on .sheet{transform:translateY(0)}
.sheet .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:-8px auto 16px}
.ctype{text-align:center;font-size:15px;font-weight:700;letter-spacing:3px;
  padding:8px 0;border-radius:12px;color:#fff}
.ctype.in{background:linear-gradient(160deg,#10b981,#047857)}
.ctype.out{background:linear-gradient(160deg,#f97316,#c2410c)}
.cwarn{margin-top:14px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;
  border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.65}
/* 上班打卡前的提醒（三國語言） */
.cnotice{background:#fef3c7;border:1.5px solid #f59e0b;border-radius:13px;
  padding:13px 14px;margin:16px 0 4px}
.cnotice .zh{font-size:15px;font-weight:700;color:#92400e;line-height:1.6}
.cnotice .vi,.cnotice .en{font-size:11.5px;color:#a16207;line-height:1.55;margin-top:7px}
.cacts{display:flex;gap:11px;margin-top:19px}
.cacts button{flex:1;padding:16px 0;border:0;border-radius:14px;font-family:inherit;
  font-size:16px;font-weight:700;letter-spacing:2px}
.cacts .cancel{flex:0 0 88px;background:#f1f5f9;color:var(--muted)}
.cacts .cancel:active{background:#e2e8f0}
.cacts .go{color:#fff}
.cacts .go.in{background:linear-gradient(160deg,#10b981,#047857)}
.cacts .go.out{background:linear-gradient(160deg,#f97316,#c2410c)}
.cacts .go:active{transform:scale(.98)}
/* 倒數期間（規則放在 .in/.out 之後才蓋得掉漸層） */
.cacts .go:disabled{background:#e2e8f0;color:#7c8ba3;letter-spacing:0;
  padding:12px 8px;line-height:1.35;text-align:center}
.cacts .go:disabled:active{transform:none}
.cacts.waiting{align-items:stretch}
.cacts .go .bzh{display:block;font-size:13.5px;font-weight:700;color:#5b6a83}
.cacts .go .bvi,.cacts .go .ben{display:block;font-size:9.5px;font-weight:400;
  margin-top:3px;line-height:1.35}
.cacts .go .bcd{display:block;font-size:20px;font-weight:700;margin-top:6px;
  color:#475569;font-variant-numeric:tabular-nums}

#loader{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;
  justify-content:center;z-index:100;color:#fff;font-size:15px;letter-spacing:1px}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite;margin-right:12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 語言切換 ── */
.hdr-r{display:flex;align-items:center;gap:8px;flex:none}
.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langseg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.langseg button{border:0;background:0;color:#cbd5e1;font-family:inherit;font-size:12px;font-weight:700;
  padding:5px 9px;border-radius:999px;cursor:pointer;letter-spacing:.3px;line-height:1.2}
.langseg button.on{background:#fff;color:#0f172a}
.loginlang{display:flex;justify-content:center;margin:18px 0 0}

/* ── 補卡／簽核卡片 ── */
#patchCard{border-top:4px solid #6366f1;padding-top:15px}
#apprCard{border-top:4px solid #7c3aed;padding-top:15px}
.chead{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.chead h3{margin:0}
.chead .qgo{margin-left:auto}
.cbadge{background:#7c3aed;color:#fff;border-radius:99px;font-size:11.5px;padding:2px 8px;font-weight:700}
.pquota{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:4px}
.pitem{padding:12px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.prow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.prow .pd{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.pitem.voided .pd{text-decoration:line-through;color:var(--muted)}
.pmeta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7;word-break:break-word}
.ps{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;flex:none}
.ps.s-pending{background:#fef3c7;color:#b45309}
.ps.s-approved{background:var(--okbg);color:var(--ok)}
.ps.s-rejected{background:var(--badbg);color:var(--bad)}
.ps.s-withdrawn,.ps.s-voided{background:#f1f5f9;color:#64748b}
.tag.patch{background:#eef2ff;color:#4f46e5}
.over{color:var(--bad);font-weight:700;font-size:12px}
.mini{margin-left:auto;border:1px solid var(--line);background:#fff;color:#475569;border-radius:8px;
  padding:5px 11px;font-size:12.5px;font-family:inherit;cursor:pointer;flex:none}
.mini.go{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:700}

/* ── 補卡表單／簽核面板（底部滑出） ── */
.ovl{position:fixed;inset:0;z-index:92;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(15,23,42,0);transition:background .25s}
.ovl.on{background:rgba(15,23,42,.55)}
.ovl .sheet{width:100%;max-width:460px;background:#fff;border-radius:22px 22px 0 0;
  padding:24px 20px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 -8px 40px rgba(15,23,42,.3)}
.ovl.on .sheet{transform:translateY(0)}
.sh-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:14px;letter-spacing:.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:#f8fafc;
  font-family:inherit;font-size:15px;font-weight:700;color:#475569;cursor:pointer}
.seg button.on.in{border-color:#059669;background:var(--okbg);color:#047857}
.seg button.on.out{border-color:#ea580c;background:#fff7ed;color:#c2410c}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.fl{margin-bottom:12px}
.frow .fl{margin-bottom:0}
.fl label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.fl input,.fl textarea{width:100%;padding:11px;font-size:15px;font-family:inherit;border:1.5px solid var(--line);
  border-radius:11px;background:#f8fafc;color:var(--ink);min-width:0}
.fl textarea{min-height:78px;resize:vertical;line-height:1.55}
.fl input:focus,.fl textarea:focus{outline:0;border-color:var(--brand);background:#fff}
.fhint{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.fwarn{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:11px;padding:10px 12px;
  font-size:12.5px;line-height:1.65;margin-bottom:10px}
.sacts{display:flex;gap:10px;margin-top:14px}
.sacts button{flex:1;padding:15px 0;border:0;border-radius:13px;font-family:inherit;font-size:15.5px;
  font-weight:700;letter-spacing:.5px;cursor:pointer}
.sacts .cancel{flex:0 0 88px;background:#f1f5f9;color:var(--muted)}
.sacts .send{background:var(--brand);color:#fff}
.sacts .rej{background:#fef2f2;color:#b91c1c;border:1.5px solid #fecaca}
.sacts .apv{background:linear-gradient(160deg,#10b981,#047857);color:#fff}
.sacts button:disabled{opacity:.5}
.dinfo{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;
  line-height:1.85;margin-bottom:12px;word-break:break-word}
.dinfo .k{color:var(--muted);display:inline-block;min-width:5.5em}
</style>
</head>
<body>

<div class="wrap">

  <!-- ══════════ 登入 ══════════ -->
  <div id="loginView" class="hidden">
    <div class="loginlang">
      <div class="langseg">
        <button data-lang="zh">中文</button><button data-lang="vi">Tiếng Việt</button><button data-lang="en">English</button>
      </div>
    </div>
    <div class="clock" style="margin-top:18px">
      <div class="t" style="font-size:30px;font-weight:600;letter-spacing:4px" data-i18n="app.title">行動打卡</div>
      <div class="d" id="loginSub" data-i18n="login.sub">請輸入員工編號與 PIN 碼</div>
    </div>
    <div class="card">
      <div class="field">
        <label for="empId" data-i18n="login.empId">員工編號</label>
        <input id="empId" type="text" inputmode="text" autocomplete="username"
               autocapitalize="characters" data-i18n-ph="login.empIdPh">
      </div>
      <div class="field">
        <label for="pin" data-i18n="login.pin">PIN 碼</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password"
               data-i18n-ph="login.pinPh">
      </div>
      <label class="check"><input id="remember" type="checkbox" checked><span data-i18n="login.remember">在這支手機記住我</span></label>
      <button id="loginBtn" class="primary" data-i18n="login.btn">登　入</button>

let pendingRows = [];     // 待我簽核
let decideTarget = null;
let pendingLimit = 0;     // 待簽清單的每月上限（標紅用）
let pfType = '上班';

const $ = id => document.getElementById(id);
const P2 = v => String(v).padStart(2, '0');

/* ─── 多國語言 ─── */
function detectLang() {
  try { const s = localStorage.getItem(LS_LANG); if (s && I18N[s]) return s; } catch (e) {}
  const list = (navigator.languages || [navigator.language || '']).map(x => String(x).toLowerCase());
  for (const l of list) {
    if (l.startsWith('vi')) return 'vi';
    if (l.startsWith('zh')) return 'zh';
    if (l.startsWith('en')) return 'en';
  }
  return 'zh';
}

function hasKey(key) { return I18N[lang][key] !== undefined || I18N.zh[key] !== undefined; }

/** t('gps.inside', {name:'公司'})；找不到時退回中文，再找不到回傳 fallback 或鍵名 */
function t(key, params, fallback) {
  let s = I18N[lang][key];
  if (s === undefined) s = I18N.zh[key];
  if (s === undefined) return fallback !== undefined ? fallback : key;
  return s.replace(/\{(\w+)\}/g, (m, k) => (params && params[k] !== undefined) ? params[k] : m);
}

function applyI18n() {
  document.documentElement.lang = LANG_HTML[lang];
  document.title = t('app.title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.langseg button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}

function setLang(l) {
  if (!I18N[l] || l === lang) return;
  lang = l;
  try { localStorage.setItem(LS_LANG, l); } catch (e) {}
  applyI18n();
  rerenderAll();
}

/** 切換語言後，把動態產生的內容全部重畫一次 */
function rerenderAll() {
  tick();
  if (pos && cfg) render();
  else if (lastGps) gpsState.apply(null, lastGps);
  drawToday(todayRows);
  drawReminders();
  if (histResult) drawHistory(histResult);
  else $('histList').innerHTML = '<div class="empty">' + esc(t('hist.hint')) + '</div>';
  if (auth) { drawPatches(); drawPending(); }
  if (rmdShowing) paintReminder(rmdShowing);
  if (pendingType) paintConfirm(pendingType);
  if (decideTarget) paintDecide(decideTarget);
  if (!$('patchSheet').classList.contains('hidden')) paintPatchForm();
}

const typeText = v => t('type.' + v, null, v);
const statusText = v => t('ps.' + v, null, v);
function signerText(v) {
  if (v === '本人撤回') return t('signer.self');
  if (v === '人資（戰情室代簽）') return t('signer.hr');
  return v;
}

/** 伺服器錯誤：有代碼就翻成目前語言，沒有就用伺服器給的中文 */
function errText(e) {
  if (e && e.code && hasKey('err.' + e.code)) {
    const p = Object.assign({}, e.params || {});
    if (p.type) p.type = typeText(p.type);
    if (p.status) p.status = statusText(p.status);
    return t('err.' + e.code, p);
  }
  return e && e.message ? e.message : t('err.generic');
}
function isAuthErr(e) {
  return !!e && (['AUTH_EXPIRED', 'AUTH_DISABLED', 'AUTH_NOT_FOUND'].indexOf(e.code) >= 0 ||
                 (!e.code && /重新登入|停用|查無/.test(e.message || '')));
}

/** 日期顯示：mm/dd 加星期，依語言調整順序 */
function dayLabel(mm, dd, wi) {
  if (lang === 'vi') return dd + '/' + mm + ' (' + WD_SHORT.vi[wi] + ')';
  if (lang === 'en') return WD_SHORT.en[wi] + ' ' + mm + '/' + dd;
  return mm + '/' + dd + '（' + WD_SHORT.zh[wi] + '）';
}
function ymdLabel(s) {           // 'yyyy/MM/dd'
  const m = String(s || '').match(/^(\d{4})\/(\d{2})\/(\d{2})/);
  if (!m) return s || '';
  return dayLabel(m[2], m[3], new Date(+m[1], +m[2] - 1, +m[3]).getDay());
}
function longDate(n) {
  const wi = n.getDay();
  if (lang === 'vi') return WD_LONG_VI[wi] + ', ' + P2(n.getDate()) + '/' + P2(n.getMonth() + 1) + '/' + n.getFullYear();
  if (lang === 'en') return WD_SHORT.en[wi] + ', ' + n.getDate() + ' ' + MON_EN[n.getMonth()] + ' ' + n.getFullYear();
  return n.getFullYear() + ' 年 ' + (n.getMonth() + 1) + ' 月 ' + n.getDate() + ' 日　星期' + WD_SHORT.zh[wi];
}

/* ─── 與後端溝通 ───
   用 text/plain 送出，避開 CORS preflight（Apps Script 不支援 OPTIONS） */
async function api(action, data) {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) {
    throw new Error(t('err.noApi'));
  }
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, data || {}))
  });
  if (!res.ok) throw new Error(t('err.http', { status: res.status }));
  const json = await res.json();
  if (json.ok === false) {
    const e = new Error(json.msg || t('err.generic'));
    e.code = json.code || '';
    e.params = json.params || {};
    throw e;
  }
  return json;
}
const authBody = extra => Object.assign({ empId: auth.empId, token: auth.token }, extra || {});

/* ─── 小工具 ─── */
function toast(msg, kind) {
  const el = $('toast');
  el.textContent = msg; el.className = 'show ' + (kind || 'ok');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => { el.className = ''; }, kind === 'bad' ? 6000 : 3800);
}
function loading(on, msg) {
  $('loaderMsg').textContent = msg || t('loading.default');
  $('loader').classList.toggle('hidden', !on);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function deviceId() {
  let d = localStorage.getItem(LS_DEV);
  if (!d) {
    d = (self.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())).slice(0, 8);
    localStorage.setItem(LS_DEV, d);
  }
  const ua = navigator.userAgent;
  const os = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : 'Other';
  return d + '/' + os;
}
function haversine(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (c - a) * r, dLng = (d - b) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function ymd(d) { return d.getFullYear() + '-' + P2(d.getMonth() + 1) + '-' + P2(d.getDate()); }
function openOvl(id) { const b = $(id); b.classList.remove('hidden'); void b.offsetWidth; b.classList.add('on'); }
function closeOvl(id) { const b = $(id); b.classList.remove('on'); setTimeout(() => b.classList.add('hidden'), 280); }

/* ─── 時鐘 ─── */
function tick() {
  const n = new Date();
  $('clockT').innerHTML = P2(n.getHours()) + ':' + P2(n.getMinutes()) + '<small>:' + P2(n.getSeconds()) + '</small>';
  $('clockD').textContent = longDate(n);
}

/* ─── 定位 ─── */
function startWatch() {
  gpsState('', 'gps.locating', null, 'gps.locatingSub', null);
  if (!navigator.geolocation) return gpsState('bad', 'gps.noSupport', null, 'gps.noSupportSub', null);
  if (!window.isSecureContext) return gpsState('bad', 'gps.noHttps', null, 'gps.noHttpsSub', null);
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(
    p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; render(); },
    err => gpsError(err),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
  );
}
function gpsError(err) {
  pos = null;
  if (err.code === 1) gpsState('bad', 'gps.denied', null, 'gps.deniedSub', null);
  else if (err.code === 3) gpsState('warn', 'gps.timeout', null, 'gps.timeoutSub', null);
  else gpsState('bad', 'gps.fail', null, 'gps.failSub', null);
  refreshButtons();
}

/**
 * 定位卡片。標題與說明都用字典鍵名傳入，切換語言時才能重畫。
 * metrics: {dist, radius, acc} 有給才顯示「距離／定位誤差」兩格數字
 */
function gpsState(kind, titleKey, titleParams, subKey, subParams, pct, metrics) {
  lastGps = [kind, titleKey, titleParams, subKey, subParams, pct, metrics];
  const c = $('gpsCard');
  c.className = 'card ' + kind;          // 一定要保留 card，否則卡片會失去白底與圓角
  $('gpsTitle').textContent = t(titleKey, titleParams);

  const m = $('gpsMetrics');
  if (metrics) {
    m.innerHTML =
      '<div class="m-dist"><b>' + metrics.dist + '</b><span>' + esc(t('gps.metersAllow', { radius: metrics.radius })) + '</span></div>' +
      '<div class="m-acc"><b>±' + metrics.acc + '</b><span>' + esc(t('gps.accuracy')) + '</span></div>';
    m.classList.remove('hidden');
  } else {
    m.classList.add('hidden');
  }
  const sub = subKey ? t(subKey, subParams) : '';
  $('gpsSub').textContent = sub;
  $('gpsSub').classList.toggle('hidden', !sub);
  $('gpsBar').style.width = (pct == null ? 0 : Math.max(3, Math.min(100, pct))) + '%';
}

/** 依目前定位計算最近地點並更新畫面 */
function render() {
  if (!pos || !cfg) return;
  if (!cfg.locations.length) {
    near = null;
    gpsState('bad', 'gps.noLoc', null, 'gps.noLocSub', null);
    return refreshButtons();
  }
  near = cfg.locations.reduce((best, L) => {
    const d = haversine(pos.lat, pos.lng, L.lat, L.lng);
    return (!best || d < best.dist) ? { name: L.name, radius: L.radius, dist: d } : best;
  }, null);

  const limit = near.radius + (cfg.tolerance || 0);
  const inside = near.dist <= limit;
  const dist = Math.round(near.dist);
  const metrics = { dist: dist, radius: near.radius, acc: Math.round(pos.acc) };

  if (pos.acc > cfg.accuracyLimit) {
    gpsState('warn', 'gps.weak', null, 'gps.weakSub', { limit: cfg.accuracyLimit }, 100, metrics);
  } else if (inside) {
    gpsState('ok', 'gps.inside', { name: near.name }, '', null, (1 - dist / limit) * 100, metrics);
  } else {
    gpsState('bad', 'gps.outside', null, 'gps.outsideSub', { name: near.name, radius: near.radius }, 100, metrics);
  }
  refreshButtons();
}

function refreshButtons() {
  const limit = near ? near.radius + (cfg.tolerance || 0) : 0;
  const can = !busy && !!pos && !!near && pos.acc <= cfg.accuracyLimit &&
              (near.dist <= limit || cfg.allowOutside);
  $('btnIn').disabled = !can;
  $('btnOut').disabled = !can;
}

/** 打卡當下重新抓一次「新鮮」座標，不吃快取 */
function freshPosition() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      err => reject(new Error(err.code === 1 ? t('err.gpsDenied') : t('err.gpsFail'))),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

/* ═══════════ 超時提醒 ═══════════
   用 20 秒輪詢比對時間，而不是 setTimeout —— 手機休眠後 setTimeout 會失準，
   輪詢則能在螢幕一亮就補上到期的提醒。 */

/** 提醒內容：新版後端給 {zh,vi,en}，舊版給中文字串 */
function rmsg(r) {
  if (!r || r.msg == null) return '';
  if (typeof r.msg === 'string') return r.msg;
  return r.msg[lang] || r.msg.zh || '';
}

function setReminders(list) {
  reminders = Array.isArray(list) ? list : [];
  drawReminders();
  checkReminders();
}

function drawReminders() {
  const box = $('rmdCard');
  if (!reminders.length) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  $('rmdList').innerHTML = reminders.map(r =>
    '<div class="rmd' + (r.acked ? ' done' : '') + '">' +
    '<span class="t">' + esc(r.time) + '</span>' +
    '<span class="m">' + esc(rmsg(r)) + '</span>' +
    (r.acked ? '<span class="ok">' + esc(t('rmd.read')) + '</span>' : '') + '</div>').join('');
}

/** 目前時間（HH:mm）已經到或超過的、還沒讀過也還沒跳過的，就排進佇列 */
function checkReminders() {
  const n = new Date();
  const now = P2(n.getHours()) + ':' + P2(n.getMinutes());
  reminders.forEach(r => {
    if (r.acked || firedIds[r.id]) return;
    if (r.time > now) return;
    firedIds[r.id] = 1;
    rmdQueue.push(r);
  });
  if (!rmdShowing) showNextReminder();
}

function paintReminder(r) {
  $('rTime').textContent = t('rmd.popTime', { time: r.time });
  $('rMsg').textContent = rmsg(r);
  $('rCnt').textContent = t('rmd.more', { n: rmdQueue.length });
  $('rCnt').classList.toggle('hidden', rmdQueue.length === 0);
}

function showNextReminder() {
  if (rmdShowing || !rmdQueue.length) return;
  const r = rmdQueue.shift();
  rmdShowing = r;
  paintReminder(r);

  const box = $('remind');
  box.classList.remove('hidden');
  void box.offsetWidth;
  box.classList.add('on');

  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  beep();
}

async function ackReminder() {
  const r = rmdShowing;
  const box = $('remind');
  box.classList.remove('on');
  setTimeout(() => box.classList.add('hidden'), 280);
  rmdShowing = null;

  if (r) {
    const hit = reminders.find(x => x.id === r.id);
    if (hit) hit.acked = true;
    drawReminders();
    try { await api('ackReminder', authBody({ id: r.id })); }
    catch (e) { /* 記錄已讀失敗不影響員工，下次開啟會再提醒一次 */ }
  }
  setTimeout(showNextReminder, 350);
}

/** 用 WebAudio 發出提示音，不需要外部音檔 */
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    [0, 0.32, 0.64].forEach(s => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + s);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + s + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + s); o.stop(ctx.currentTime + s + 0.24);
    });
    setTimeout(() => ctx.close(), 1500);
  } catch (e) { /* 靜音模式或未授權播放，就只靠震動與畫面 */ }
}

/* ─── 打卡確認面板 ─── */
function askPunch(type) {
  if (busy || !pos || !near) return;
  pendingType = type;

  const isIn = type === '上班';
  $('cType').className = 'ctype ' + (isIn ? 'in' : 'out');
  $('cGo').className = 'go ' + (isIn ? 'in' : 'out');

  // 三國語言提醒（不隨介面語言變動，永遠三語並列）
  const showNotice = (NOTICE.zh || NOTICE.vi || NOTICE.en) &&
                     (NOTICE.showOn === 'both' || NOTICE.showOn === type);
  $('cNotice').classList.toggle('hidden', !showNotice);
  if (showNotice) {
    $('cNoticeZh').textContent = NOTICE.zh ? '⚠ ' + NOTICE.zh : '';
    $('cNoticeVi').textContent = NOTICE.vi || '';
    $('cNoticeEn').textContent = NOTICE.en || '';
  }
  paintConfirm(type);

  // 有提醒要看時，確認鈕先鎖住倒數幾秒，逼使用者真的把提醒讀完
  startCountdown(showNotice ? (Number(NOTICE.countdown) || 0) : 0);

  const box = $('confirm');
  box.classList.remove('hidden');
  void box.offsetWidth;            // 強制重繪，確保滑入動畫一定會播（rAF 在背景分頁可能不觸發）
  box.classList.add('on');
}

/** 確認面板裡會隨語言變動的部分 */
function paintConfirm(type) {
  $('cType').textContent = t(type === '上班' ? 'punch.in' : 'punch.out');
  const same = todayRows.filter(r => r.type === type);
  const warn = $('cWarn');
  if (same.length) {
    warn.innerHTML = t('confirm.dup', { type: esc(typeText(type)), times: esc(same.map(r => r.time).join('、')) });
    warn.classList.remove('hidden');
  } else {
    warn.classList.add('hidden');
  }
  if (!cdTimer) $('cGo').textContent = t('confirm.go');
}

/** sec > 0 時，確認鈕在倒數結束前不能按，鈕面顯示三語「請詳閱提醒」與剩餘秒數 */
function startCountdown(sec) {
  const go = $('cGo'), acts = go.parentElement;
  clearInterval(cdTimer); cdTimer = null;

  const done = () => {
    clearInterval(cdTimer); cdTimer = null;
    go.disabled = false;
    go.textContent = t('confirm.go');
    acts.classList.remove('waiting');
  };
  if (!sec || sec < 1) return done();

  let left = Math.round(sec);
  const paint = () => {
    go.innerHTML =
      (NOTICE.waitZh ? '<span class="bzh">' + esc(NOTICE.waitZh) + '</span>' : '') +
      (NOTICE.waitVi ? '<span class="bvi">' + esc(NOTICE.waitVi) + '</span>' : '') +
      (NOTICE.waitEn ? '<span class="ben">' + esc(NOTICE.waitEn) + '</span>' : '') +
      '<span class="bcd">' + left + '</span>';
  };
  go.disabled = true;
  acts.classList.add('waiting');
  paint();
  cdTimer = setInterval(() => {
    left--;
    if (left > 0) return paint();
    done();
  }, 1000);
}

function closeConfirm() {
  clearInterval(cdTimer); cdTimer = null;
  pendingType = null;
  $('confirm').classList.remove('on');
  setTimeout(() => $('confirm').classList.add('hidden'), 280);
}

/* ─── 打卡 ─── */
async function punch(type) {
  if (busy) return;
  busy = true; refreshButtons(); loading(true, t('loading.locate'));
  try {
    const fresh = await freshPosition();
    pos = fresh; render();
    loading(true, t('loading.send'));
    const r = await api('punch', authBody({ type: type, lat: fresh.lat, lng: fresh.lng, acc: fresh.acc, device: deviceId() }));
    drawToday(r.today);
    toast(t('punch.ok', { type: typeText(type), time: r.time, loc: r.location, dist: r.distance }),
          r.result === '正常' ? 'ok' : 'warn');
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) {
    toast('✕ ' + errText(e), 'bad');
    if (isAuthErr(e)) logout();
  } finally {
    busy = false; loading(false); refreshButtons();
  }
}

/** 紀錄右側說明：地點距離、異常或補卡標籤 */
function recMeta(x) {
  if (x.result === '補卡') return '<span class="tag patch">' + esc(t('result.補卡')) + '</span>';
  return esc(x.loc) + '　' + esc(t('unit.m', { d: x.dist })) +
    (x.result !== '正常' ? '<br>⚠ ' + esc(t('result.' + x.result, null, x.result)) : '');
}

function drawToday(rows) {
  todayRows = rows || [];
  const box = $('todayList');
  if (!todayRows.length) { box.innerHTML = '<div class="empty">' + esc(t('today.empty')) + '</div>'; return; }
  box.innerHTML = todayRows.map(r =>
    '<div class="rec"><span class="tag ' + (r.type === '上班' ? 'in' : 'out') + '">' + esc(typeText(r.type)) + '</span>' +
    '<span class="tm">' + esc(r.time) + '</span><span class="mt">' + recMeta(r) + '</span></div>').join('');
}

/* ─── 查詢紀錄 ─── */

/** 快捷區間 */
function setQRange(q) {
  const n = new Date();
  let f, to = n;
  if (q === 'lastMonth') {
    f = new Date(n.getFullYear(), n.getMonth() - 1, 1);
    to = new Date(n.getFullYear(), n.getMonth(), 0);
  } else if (q === '7d') { f = new Date(n); f.setDate(n.getDate() - 6); }
  else if (q === '30d') { f = new Date(n); f.setDate(n.getDate() - 29); }
  else { q = 'thisMonth'; f = new Date(n.getFullYear(), n.getMonth(), 1); }
  $('qFrom').value = ymd(f);
  $('qTo').value = ymd(to);
  $('qTo').max = ymd(n);
  $('qFrom').max = ymd(n);
  document.querySelectorAll('[data-q]').forEach(b => b.classList.toggle('on', b.dataset.q === q));
}

async function loadHistory() {
  const from = $('qFrom').value, to = $('qTo').value;
  if (!from || !to) return toast(t('hist.needDates'), 'bad');
  if (from > to) return toast(t('err.RANGE_ORDER'), 'bad');

  $('histBtn').disabled = true;
  $('histInfo').classList.add('hidden');
  $('histList').innerHTML = '<div class="empty">' + esc(t('hist.loading')) + '</div>';
  try {
    histResult = await api('history', authBody({ from: from, to: to }));
    drawHistory(histResult);
  } catch (e) {
    histResult = null;
    if (isAuthErr(e)) return logout();
    $('histList').innerHTML = '<div class="empty">' + esc(t('hist.fail', { msg: errText(e) })) + '</div>';
  } finally {
    $('histBtn').disabled = false;
  }
}

function drawHistory(r) {
  if (!r.count) {
    $('histList').innerHTML = '<div class="empty">' + esc(t('hist.none')) + '</div>';
  } else {
    let html = '', lastDate = '';
    r.rows.forEach(x => {
      if (x.date !== lastDate) {
        lastDate = x.date;
        const md = String(x.date).split('/');
        html += '<div class="dsep">' + esc(dayLabel(md[0], md[1], '日一二三四五六'.indexOf(x.wd))) + '</div>';
      }
      html += '<div class="rec"><span class="tag ' + (x.type === '上班' ? 'in' : 'out') + '">' +
        esc(typeText(x.type)) + '</span><span class="tm">' + esc(x.time) + '</span>' +
        '<span class="mt">' + recMeta(x) + '</span></div>';
    });
    $('histList').innerHTML = html;
  }
  $('histInfo').textContent = t('hist.info', { from: r.from, to: r.to, n: r.count });
  $('histInfo').classList.remove('hidden');
}

/* ═══════════ 忘刷卡補卡 ═══════════ */

async function loadPatches() {
  if (!auth) return;
  try {
    patchInfo = await api('patchMine', authBody());
  } catch (e) {
    if (isAuthErr(e)) return logout();
    patchInfo = null;
    $('patchList').innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>';
    return;
  }
  drawPatches();
}

/** 一張補卡單的 HTML；forAppr＝主管簽核清單用 */
function patchItemHtml(x, forAppr) {
  const md = x.date;
  const lines = [];
  if (forAppr) lines.push(esc(t('patch.who', { name: x.name, id: x.empId, dept: x.dept })));
  lines.push(esc(t('patch.reasonLine', { r: x.reason })));
  lines.push(esc(t('patch.applied', { at: x.appliedAt })) + (x.count > 0 ? '　・　' + esc(t('patch.nth', { n: x.count })) : ''));
  if (x.signer && x.status !== '待審') lines.push(esc(signerText(x.signer)) + '　' + esc(x.signedAt));
  if (x.comment) lines.push(esc(t('patch.comment', { c: x.comment })));
  if (x.status === '作廢' && x.voidReason) lines.push(esc(t('patch.void', { r: x.voidReason })));

  let btn = '';
  if (forAppr) btn = '<button class="mini go" data-dc="' + esc(x.id) + '">' + esc(t('appr.review')) + '</button>';
  else if (x.status === '待審') btn = '<button class="mini" data-wd="' + esc(x.id) + '">' + esc(t('patch.withdraw')) + '</button>';

  return '<div class="pitem' + (x.status === '作廢' ? ' voided' : '') + '">' +
    '<div class="prow">' +
      '<span class="ps ' + (STATUS_CLASS[x.status] || 's-pending') + '">' + esc(statusText(x.status)) + '</span>' +
      '<span class="tag ' + (x.type === '上班' ? 'in' : 'out') + '">' + esc(typeText(x.type)) + '</span>' +
      '<span class="pd">' + esc(ymdLabel(md)) + ' ' + esc(x.time) + '</span>' +
      (x.overLimit ? '<span class="over">⚠ ' + esc(t('appr.over', { limit: (forAppr ? pendingLimit : patchInfo && patchInfo.limit) || '' })) + '</span>' : '') +
      btn +
    '</div>' +
    '<div class="pmeta">' + lines.join('<br>') + '</div></div>';
}

function drawPatches() {
  if (!auth) return;
  if (!patchInfo) {
    $('patchQuota').textContent = '';
    $('patchList').innerHTML = '<div class="empty">' + esc(t('patch.loading')) + '</div>';
    return;
  }
  const n = new Date();
  const ym = n.getFullYear() + '/' + P2(n.getMonth() + 1);
  $('patchQuota').innerHTML =
    esc(t('patch.quota', { count: patchInfo.counts[ym] || 0, limit: patchInfo.limit, days: patchInfo.days })) + '<br>' +
    esc(patchInfo.toHr ? t('patch.toHr') : t('patch.approverIs', { name: patchInfo.approver }));
  $('patchList').innerHTML = patchInfo.rows.length
    ? patchInfo.rows.map(x => patchItemHtml(x, false)).join('')
    : '<div class="empty">' + esc(t('patch.empty')) + '</div>';
  $('patchList').querySelectorAll('[data-wd]').forEach(b => { b.onclick = () => withdrawPatch(b.dataset.wd); });
}

function openPatchForm() {
  if (!patchInfo) { loadPatches(); return; }
  const n = new Date();
  const minD = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  minD.setDate(minD.getDate() - patchInfo.days);
  $('pfDate').min = ymd(minD);
  $('pfDate').max = ymd(n);
  $('pfDate').value = ymd(n);
  $('pfTime').value = '';
  $('pfReason').value = '';
  pfType = '上班';
  paintPatchForm();
  openOvl('patchSheet');
}

function paintPatchForm() {
  document.querySelectorAll('[data-pt]').forEach(b => b.classList.toggle('on', b.dataset.pt === pfType));
  if (patchInfo) $('pfRule').textContent = t('patch.rule', { days: patchInfo.days, limit: patchInfo.limit });
  updateOverWarn();
}

/** 選到的日期所屬月份若已達上限，提醒會被標紅 */
function updateOverWarn() {
  const d = $('pfDate').value, box = $('pfOver');
  if (!d || !patchInfo) { box.classList.add('hidden'); return; }
  const ym = d.slice(0, 7).replace('-', '/');
  const next = (patchInfo.counts[ym] || 0) + 1;
  if (next > patchInfo.limit) {
    box.textContent = t('patch.overWarn', { ym: ym, count: next, limit: patchInfo.limit });
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }
}

async function submitPatch() {
  const date = $('pfDate').value, time = $('pfTime').value, reason = $('pfReason').value.trim();
  if (!date || !time || reason.length < 2) return toast(t('patch.needFields'), 'bad');
  if (new Date(date + 'T' + time + ':00') > new Date()) return toast(t('patch.future'), 'bad');

  $('pfSend').disabled = true;
  try {
    const r = await api('patchSubmit', authBody({ date: date, time: time, type: pfType, reason: reason }));
    closeOvl('patchSheet');
    toast(r.toHr ? t('patch.sentHr') : t('patch.sent', { name: r.approver }), r.overLimit ? 'warn' : 'ok');
    loadPatches();
  } catch (e) {
    if (isAuthErr(e)) { closeOvl('patchSheet'); return logout(); }
    toast('✕ ' + errText(e), 'bad');
  } finally {
    $('pfSend').disabled = false;
  }
}

async function withdrawPatch(id) {
  if (!confirm(t('patch.withdrawConfirm'))) return;
  try {
    await api('patchWithdraw', authBody({ id: id }));
    toast(t('patch.withdrawn'));
    loadPatches();
  } catch (e) {
    if (isAuthErr(e)) return logout();
    toast('✕ ' + errText(e), 'bad');
    loadPatches();
  }
}

/* ─── 主管簽核 ─── */

async function loadPending() {
  if (!auth || !approval.isApprover) {
    pendingRows = [];
    $('apprCard').classList.add('hidden');
    return;
  }
  $('apprCard').classList.remove('hidden');
  try {
    const r = await api('patchPending', authBody());
    pendingRows = r.rows || [];
    approval.pending = pendingRows.length;
    pendingLimit = r.limit || 0;
  } catch (e) {
    if (isAuthErr(e)) return logout();
    $('apprList').innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>';
    return;
  }
  drawPending();
}

function drawPending() {
  if (!approval.isApprover) { $('apprCard').classList.add('hidden'); return; }
  $('apprCard').classList.remove('hidden');
  $('apprCnt').textContent = pendingRows.length;
  $('apprCnt').classList.toggle('hidden', !pendingRows.length);
  $('apprList').innerHTML = pendingRows.length
    ? pendingRows.map(x => patchItemHtml(x, true)).join('')
    : '<div class="empty">' + esc(t('appr.empty')) + '</div>';
  $('apprList').querySelectorAll('[data-dc]').forEach(b => { b.onclick = () => openDecide(b.dataset.dc); });
}

function openDecide(id) {
  decideTarget = pendingRows.find(x => x.id === id);
  if (!decideTarget) return;
  $('dComment').value = '';
  paintDecide(decideTarget);
  openOvl('decideSheet');
}

function paintDecide(x) {
  const row = (k, v) => '<span class="k">' + esc(t(k)) + '</span>' + v;
  $('dInfo').innerHTML = [
    row('appr.applicant', esc(t('patch.who', { name: x.name, id: x.empId, dept: x.dept }))),
    row('appr.patch', '<b>' + esc(ymdLabel(x.date)) + ' ' + esc(x.time) + '</b>　' + esc(typeText(x.type))),
    row('appr.reason', esc(x.reason)),
    row('appr.applied', esc(x.appliedAt) + '　・　' +
      (x.overLimit ? '<span class="over">' + esc(t('patch.nth', { n: x.count })) + '　⚠ ' +
                     esc(t('appr.over', { limit: pendingLimit || '' })) + '</span>'
                   : esc(t('patch.nth', { n: x.count }))))
  ].join('<br>');
}

function closeDecide() { decideTarget = null; closeOvl('decideSheet'); }

async function decide(decision) {
  if (!decideTarget) return;
  const comment = $('dComment').value.trim();
  if (decision === 'reject' && !comment) return toast(t('appr.needComment'), 'bad');

  ['dApprove', 'dReject'].forEach(id => { $(id).disabled = true; });
  try {
    await api('patchDecide', authBody({ id: decideTarget.id, decision: decision, comment: comment }));
    closeDecide();
    toast(decision === 'approve' ? t('appr.doneApprove') : t('appr.doneReject'));
    loadPending();
  } catch (e) {
    if (isAuthErr(e)) { closeDecide(); return logout(); }
    toast('✕ ' + errText(e), 'bad');
    closeDecide();
    loadPending();                 // 可能已被別人（人資）簽掉，重抓清單
  } finally {
    ['dApprove', 'dReject'].forEach(id => { $(id).disabled = false; });
  }
}

/* ─── 登入 / 登出 ─── */
async function login() {
  const empId = $('empId').value.trim();
  const pin = $('pin').value.trim();
  if (!empId || !pin) return toast(t('login.needBoth'), 'bad');
  $('loginBtn').disabled = true; loading(true, t('loading.login'));
  try {
    const r = await api('login', { empId: empId, pin: pin });
    auth = { empId: r.empId, token: r.token, name: r.name, dept: r.dept };
    if ($('remember').checked) localStorage.setItem(LS, JSON.stringify(auth));
    else sessionStorage.setItem(LS, JSON.stringify(auth));
    enterMain(r);
  } catch (e) {
    toast('✕ ' + errText(e), 'bad');
  } finally {
    $('loginBtn').disabled = false; loading(false);
  }
}

function logout() {
  localStorage.removeItem(LS); sessionStorage.removeItem(LS);
  if (pendingType) closeConfirm();
  ['patchSheet', 'decideSheet'].forEach(id => { $(id).classList.remove('on'); $(id).classList.add('hidden'); });
  auth = null; todayRows = []; histResult = null;
  reminders = []; firedIds = {}; rmdQueue = []; rmdShowing = null;
  approval = { isApprover: false, pending: 0 }; patchInfo = null; pendingRows = []; decideTarget = null;
  $('rmdCard').classList.add('hidden');
  $('apprCard').classList.add('hidden');
  $('remind').classList.remove('on'); $('remind').classList.add('hidden');
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  $('mainView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  $('pin').value = '';
}

/** 定期回頭問伺服器：拿人資剛加的提醒、主管的待簽數量 */
async function refreshToday() {
  if (!auth) return;
  try {
    const r = await api('today', authBody());
    drawToday(r.today);
    setReminders(r.reminders);
    const prev = approval;
    approval = r.approval || { isApprover: false, pending: 0 };
    if (approval.isApprover !== prev.isApprover || approval.pending !== prev.pending) loadPending();
  } catch (e) {
    if (isAuthErr(e)) logout();
  }
}

function enterMain(r) {
  $('uName').textContent = auth.name;
  $('uMeta').textContent = auth.dept + '　' + auth.empId;
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  drawToday(r.today || []);
  setReminders(r.reminders || []);
  setQRange('thisMonth');
  histResult = null;
  $('histList').innerHTML = '<div class="empty">' + esc(t('hist.hint')) + '</div>';
  approval = r.approval || { isApprover: false, pending: 0 };
  patchInfo = null;
  drawPatches();
  loadPatches();
  loadPending();
  startWatch();
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone && !localStorage.getItem(LS_BANNER)) $('installBanner').classList.remove('hidden');
}

/* ─── 啟動 ─── */
async function boot() {
  applyI18n();
  tick(); setInterval(tick, 1000);

  document.querySelectorAll('.langseg button').forEach(b => { b.onclick = () => setLang(b.dataset.lang); });
  $('loginBtn').onclick = login;
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  $('logoutBtn').onclick = () => { if (confirm(t('main.logoutConfirm'))) logout(); };
  $('btnIn').onclick = () => askPunch('上班');
  $('btnOut').onclick = () => askPunch('下班');
  $('cCancel').onclick = closeConfirm;
  $('cGo').onclick = () => {
    const tp = pendingType;
    closeConfirm();
    if (tp) punch(tp);
  };
  $('confirm').addEventListener('click', e => { if (e.target.id === 'confirm') closeConfirm(); });
  $('rOk').onclick = ackReminder;

  $('patchNew').onclick = openPatchForm;
  $('pfCancel').onclick = () => closeOvl('patchSheet');
  $('pfSend').onclick = submitPatch;
  $('pfDate').addEventListener('change', updateOverWarn);
  document.querySelectorAll('[data-pt]').forEach(b => { b.onclick = () => { pfType = b.dataset.pt; paintPatchForm(); }; });
  $('patchSheet').addEventListener('click', e => { if (e.target.id === 'patchSheet') closeOvl('patchSheet'); });
  $('dCancel').onclick = closeDecide;
  $('dApprove').onclick = () => decide('approve');
  $('dReject').onclick = () => decide('reject');
  $('decideSheet').addEventListener('click', e => { if (e.target.id === 'decideSheet') closeDecide(); });

  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (pendingType) closeConfirm();
    if (!$('patchSheet').classList.contains('hidden')) closeOvl('patchSheet');
    if (decideTarget) closeDecide();
  });

  // 每 20 秒比對一次提醒時間；每 5 分鐘向伺服器重抓提醒與待簽數
  setInterval(() => { if (auth) checkReminders(); }, 20000);
  setInterval(refreshToday, 300000);
  // 手機從休眠醒來、或切回 App 時立刻補檢查，順便更新補卡狀態
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && auth) { checkReminders(); refreshToday(); loadPatches(); }
  });
  $('histBtn').onclick = loadHistory;
  document.querySelectorAll('[data-q]').forEach(b => {
    b.onclick = () => { setQRange(b.dataset.q); loadHistory(); };
  });
  $('closeBanner').onclick = () => {
    $('installBanner').classList.add('hidden'); localStorage.setItem(LS_BANNER, '1');
  };

  try {
    cfg = await api('config');
  } catch (e) {
    $('loginSub').textContent = t('login.cannotConnect', { msg: errText(e) });
    $('loginView').classList.remove('hidden');
    return;
  }

  const saved = localStorage.getItem(LS) || sessionStorage.getItem(LS);
  if (saved) {
    try {
      auth = JSON.parse(saved);
      const r = await api('today', authBody());
      return enterMain(r);
    } catch (e) {
      localStorage.removeItem(LS); sessionStorage.removeItem(LS); auth = null;
    }
  }
  $('loginView').classList.remove('hidden');
}

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
boot();
</script>
</body>
</html>
